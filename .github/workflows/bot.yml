name: BybitX Signal Bot


on:


  schedule:


    # каждые 20 минут

    - cron: "*/20 * * * *"



    # ежедневный отчёт

    - cron: "0 0 * * *"



  workflow_dispatch:



jobs:



  bot:


    runs-on: ubuntu-latest



    steps:



      - name: Checkout

        uses: actions/checkout@v4



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"



      - name: Install packages

        run: |

          pip install --upgrade pip

          pip install -r requirements.txt



      - name: Restore data

        uses: actions/cache@v4

        with:

          path:

            data/

          key:

            bybit-data-${{ github.run_id }}

          restore-keys:

            |

            bybit-data-



      - name: Run signal bot

        if:

          github.event.schedule != '0 0 * * *'

        env:


          TELEGRAM_TOKEN:

            ${{ secrets.TELEGRAM_TOKEN }}


          TELEGRAM_CHANNEL_ID:

            ${{ secrets.TELEGRAM_CHANNEL_ID }}


          MISTRAL_API_KEY:

            ${{ secrets.MISTRAL_API_KEY }}


        run:

          python main.py



      - name: Run report

        if:

          github.event.schedule == '0 0 * * *'

        env:


          TELEGRAM_TOKEN:

            ${{ secrets.TELEGRAM_TOKEN }}


          TELEGRAM_CHANNEL_ID:

            ${{ secrets.TELEGRAM_CHANNEL_ID }}


        run:

          python -c "

          import asyncio;

          from bot.report_job import ReportJob;

          asyncio.run(ReportJob().run())

          "